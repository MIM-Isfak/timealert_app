# Activated explicitly by Render. Required values have no development fallback.
server.address=0.0.0.0
server.port=${PORT:10000}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
allowed.origins=${ALLOWED_ORIGINS:}
jwt.secret=${JWT_SECRET}
legacy.email-reminders.enabled=${LEGACY_EMAIL_REMINDERS_ENABLED:false}
management.health.mail.enabled=false
spring.mail.test-connection=false
# Pilot schema creation/update is explicit. Back up Neon before each release.
# A versioned migration process is required before broader production use.
spring.jpa.hibernate.ddl-auto=update
debug=false
logging.level.root=WARN
logging.level.com.timealert=INFO
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web=OFF
spring.mvc.log-request-details=false
