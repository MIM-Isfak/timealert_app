spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/timealert}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# WARNING: ddl-auto=update is fine for development. For production, use 'validate' with Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=${PORT:8080}
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000}
jwt.secret=${JWT_SECRET:timealert-secret-key-must-be-at-least-32-chars}

# Spring Mail SMTP Settings (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

# Actuator: expose only /actuator/health — hides internal details from external callers
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never